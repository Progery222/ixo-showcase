<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>iXo Carousels</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap">
<style>
/* Layout: a dark iXo catalogue. Sticky control bar with the branch index, then one chapter per
   branch; inside it one band per theme: reasoning on the left, the real slides on the right in
   two styles (with a hero, text only). Any slide opens full screen. Single dark look on purpose:
   it is iXo's own site palette, and the slides themselves carry the light/dark switch. */
:root{
  --bg:#111111;        /* iXo background */
  --panel:#1c1c1c;     /* iXo panels */
  --line:#2a2a28;      /* hairlines, warm grey toward the accent */
  --fg:#f1f1ef;        /* iXo text */
  --fg2:#b4b3ad;       /* secondary text */
  --fg3:#7d7c76;       /* captions */
  --accent:#ffd705;    /* iXo yellow: only for the active state and the iXo voice */
  --on-accent:#111111;
  --display:"Inter Tight",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--display);font-size:16px;line-height:1.5;
     -webkit-font-smoothing:antialiased;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Control bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(17,17,17,.92);
     backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;margin-right:auto;white-space:nowrap}
.brand img{height:22px;width:auto}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:500;color:var(--fg2);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.nav{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:0 12px}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--fg2);white-space:nowrap}
.nav a:hover{border-color:var(--fg3);color:var(--fg)}
.nav a.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.nav .n{opacity:.6;margin-left:6px;font-variant-numeric:tabular-nums}

/* Intro */
.intro{padding-block:56px 40px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px;align-items:end}
.intro h1{font-size:clamp(36px,5.4vw,72px);line-height:1;letter-spacing:-.035em;margin:0;font-weight:700;text-wrap:balance}
.intro h1 b{color:var(--accent);font-weight:700}
.intro p{color:var(--fg2);font-size:17px;max-width:56ch;margin:20px 0 0}
.rules{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rules li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start;color:var(--fg2);font-size:15px}
.rules li::before{content:"";width:12px;height:12px;border-radius:50%;margin-top:6px;background:var(--fg3)}
.rules li.y::before{background:var(--accent)}
.note{color:var(--fg3);font-size:13px;margin-top:6px}

/* Branch chapters */
.branch{scroll-margin-top:110px;padding-top:24px}
.bhead{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:32px;align-items:end;padding-block:28px 20px;border-top:2px solid var(--fg)}
.bhead .k{font-size:13px;color:var(--fg3);font-variant-numeric:tabular-nums}
.bhead h2{font-size:clamp(30px,3.6vw,48px);line-height:1;letter-spacing:-.03em;margin:6px 0 0;text-wrap:balance}
.bhead p{margin:0;color:var(--fg2);font-size:16px;max-width:60ch}

/* Theme bands */
.theme{border-top:1px solid var(--line);padding-block:28px;display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:32px;scroll-margin-top:110px}
.meta h3{font-size:28px;line-height:1.05;letter-spacing:-.025em;margin:10px 0 12px;text-wrap:balance}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--fg2);
      border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
.meta .why{color:var(--fg2);font-size:15px;margin:0}
.meta .ixo{margin:14px 0 0;font-size:14px;color:var(--fg);padding-left:14px;border-left:2px solid var(--accent)}
.strips{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;min-width:0}
.strips > div{min-width:0}
.cap{font-size:12px;font-weight:600;color:var(--fg3);margin:0 0 8px;display:flex;gap:8px}
.cap span{font-weight:400;font-variant-numeric:tabular-nums}
.strip{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;min-width:0;
       scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.frame{--w:200px;flex:none;width:var(--w);aspect-ratio:9/16;border-radius:14px;overflow:hidden;position:relative;
       background:var(--panel);scroll-snap-align:start;cursor:zoom-in;border:0;padding:0;max-width:100%;transition:transform .2s ease}
.frame:hover{transform:translateY(-3px)}
.ig .frame{aspect-ratio:4/5;--w:240px}
.both .frame{--w:168px}
.both.ig .frame{--w:208px}
/* --k scales a 1080px slide to its frame: --w / 1080. Set here so the page also works with
   scripts off (iPhone previews); fit() then sets the measured value on body. */
body{--k:.18519} body.ig{--k:.22222} body.both{--k:.15556} body.both.ig{--k:.19259}
.frame > .slide,.frame > .ts,.vframe > .slide,.vframe > .ts{position:absolute;left:0;top:0;transform:scale(var(--k));transform-origin:0 0;pointer-events:none}
.frame .num{position:absolute;right:8px;bottom:8px;font-size:11px;font-weight:600;background:rgba(17,17,17,.7);
            color:#f1f1ef;padding:2px 7px;border-radius:999px;font-variant-numeric:tabular-nums}

/* Full-screen viewer */
.viewer{position:fixed;inset:0;z-index:50;background:rgba(10,10,10,.97);display:grid;
        grid-template-rows:auto minmax(0,1fr) auto;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.viewer[hidden]{display:none!important}
.vtop{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--fg2)}
.vtop b{color:var(--fg);font-weight:600}
.vtop .x{margin-left:auto}
.ibtn{border:1px solid var(--line);background:var(--panel);border-radius:999px;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;font-size:18px;flex:none}
.stage{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:16px;min-height:0;padding-top:12px}
.vframe{justify-self:center;height:100%;max-height:100%;aspect-ratio:9/16;max-width:100%;border-radius:18px;overflow:hidden;position:relative;background:var(--panel);touch-action:pan-y}
.ig .vframe{aspect-ratio:4/5}
.dots{display:flex;justify-content:center;gap:6px;padding-top:12px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.foot{border-top:1px solid var(--line);margin-top:24px;padding-block:28px 48px;color:var(--fg3);font-size:13px}

@media (max-width:860px){
  .intro{grid-template-columns:minmax(0,1fr);padding-block:36px 24px;gap:24px}
  .bhead,.theme{grid-template-columns:minmax(0,1fr);gap:14px}
  .frame{--w:160px} .both .frame{--w:150px} .ig .frame{--w:200px} .both.ig .frame{--w:190px}
  body{--k:.14815} body.both{--k:.13889} body.ig{--k:.18519} body.both.ig{--k:.17593}
  .stage{grid-template-columns:minmax(0,1fr)}
  .stage .ibtn{display:none}
}
@media (max-width:600px){
  .bar .wrap{gap:8px;padding-block:8px}
  .brand span,.seg .wide{display:none}
  .seg button{padding:5px 9px;font-size:12px}
  .nav{padding-block:0 8px}
  .nav a{font-size:12px;padding:4px 10px}
}
@media (prefers-reduced-motion:reduce){.frame{transition:none}.frame:hover{transform:none}}

/* iXo photo slides. One slide is 1080x1920 (TikTok) or 1080x1350 (.ig, Instagram 4:5), drawn at
   full size and scaled by whoever shows it. Text stays out of the TikTok UI zones:
   top 150, bottom 400, right 140. .light is the light theme, .fx turns on the glass blur. */
.slide{
  --ink:#111111;      /* brand background */
  --paper:#f1f1ef;    /* brand text */
  --yolk:#ffd705;     /* brand accent: the voice of iXo */
  --fg:var(--paper); --fg2:rgba(241,241,239,.84); --fg3:rgba(241,241,239,.66);
  --glass:rgba(26,26,26,.72); --edge:rgba(255,255,255,.10); --rule:rgba(255,255,255,.08);
  --chip:rgba(241,241,239,.12); --on-bg:var(--paper); --on-fg:var(--ink);
  --scrim:linear-gradient(180deg,rgba(0,0,0,.42) 0,rgba(0,0,0,0) 13%,rgba(0,0,0,0) 40%,
          rgba(12,12,12,.72) 60%,rgba(12,12,12,.86) 78%,rgba(12,12,12,.82) 100%);
  --bottom:430px; --mark-top:170px; --sheet-top:930px;
  position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--ink);color:var(--fg);
  font-family:"Inter Tight",system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-align:left;
}
.slide *{box-sizing:border-box;margin:0;padding:0}
.slide.ig{height:1350px;--bottom:120px;--mark-top:72px;--sheet-top:640px}
.slide.light{
  --fg:var(--ink); --fg2:rgba(17,17,17,.78); --fg3:rgba(17,17,17,.56);
  --glass:rgba(241,241,239,.78); --edge:rgba(17,17,17,.08); --rule:rgba(17,17,17,.09);
  --chip:rgba(17,17,17,.08); --on-bg:var(--ink); --on-fg:var(--paper);
  --scrim:linear-gradient(180deg,rgba(0,0,0,.30) 0,rgba(0,0,0,0) 13%,rgba(241,241,239,0) 38%,
          rgba(241,241,239,.80) 58%,rgba(241,241,239,.94) 74%,rgba(241,241,239,.96) 100%);
}
.slide .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none;
  filter:saturate(.86) contrast(1.06) brightness(.97)}
.slide div.photo{background-size:cover;background-repeat:no-repeat}
.slide .mark.mk{background:center/contain no-repeat}
.slide .dim{position:absolute;inset:0;background:rgba(10,10,10,var(--d))}
.slide.light .dim{background:rgba(241,241,239,calc(var(--d) * .6))}
.slide .scrim{position:absolute;inset:0;background:var(--scrim)}
/* A panel lifts the headline into the photo, so the shade starts higher */
.slide.tall{--scrim:linear-gradient(180deg,rgba(0,0,0,.42) 0,rgba(0,0,0,0) 12%,rgba(12,12,12,.10) 24%,
          rgba(12,12,12,.74) 40%,rgba(12,12,12,.86) 62%,rgba(12,12,12,.82) 100%)}
.slide.light.tall{--scrim:linear-gradient(180deg,rgba(0,0,0,.30) 0,rgba(0,0,0,0) 12%,rgba(241,241,239,.12) 24%,
          rgba(241,241,239,.82) 40%,rgba(241,241,239,.94) 60%,rgba(241,241,239,.96) 100%)}
.slide .grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
/* iXo mark from ixo.chat/assets/ixo.svg, in its own yellow */
.slide .mark{position:absolute;left:80px;top:var(--mark-top);width:91px;height:50px;filter:drop-shadow(0 2px 10px rgba(0,0,0,.45))}

.slide .copy{position:absolute;left:80px;right:160px;bottom:var(--bottom)}
.slide .label{font-size:38px;font-weight:600;letter-spacing:-.005em;color:var(--fg3);margin-bottom:26px}
.slide h1{font-weight:700;font-size:118px;line-height:.98;letter-spacing:-.04em;text-wrap:balance}
.slide h1.l{font-size:96px;line-height:1}                               /* long headline, keeps clear of the face */
.slide h1.m{font-size:84px;line-height:1.02;letter-spacing:-.035em}   /* headline above a panel */
.slide.ig h1{font-size:104px}
.slide.ig h1.l{font-size:88px}
.slide.ig h1.m{font-size:76px}
.slide .sub{margin-top:38px;font-weight:450;font-size:44px;line-height:1.28;letter-spacing:-.01em;color:var(--fg2);max-width:780px}

/* Glass panel: lists, options, bars, comparison */
.slide .panel{margin-top:44px;padding:12px;border-radius:32px;background:var(--glass);border:1px solid var(--edge)}
.slide.fx .panel,.slide.fx .tab,.slide.fx .me{backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.slide .row{display:flex;align-items:center;gap:28px;padding:24px 28px;border-radius:22px;
  font-size:44px;line-height:1.2;font-weight:500;letter-spacing:-.01em}
.slide .row + .row{box-shadow:0 -1px 0 var(--rule)}
.slide .row .k{flex:none;width:64px;height:64px;border-radius:20px;display:grid;place-items:center;
  background:var(--chip);font-size:34px;font-weight:700}
.slide .row.on{background:var(--on-bg);color:var(--on-fg);box-shadow:none}
.slide .row.on + .row{box-shadow:none}
.slide .row.on .k{background:rgba(128,128,128,.18)}
.slide .bar{padding:22px 28px}
.slide .bar + .bar{box-shadow:0 -1px 0 var(--rule)}
.slide .bar .t{display:flex;justify-content:space-between;font-size:40px;font-weight:500;margin-bottom:16px}
.slide .bar .track{height:16px;border-radius:8px;background:var(--chip)}
.slide .bar .fill{height:100%;border-radius:8px;background:var(--fg);opacity:.86}
.slide .bar.hot .fill{background:var(--yolk);opacity:1}
.slide .bar.hot .t b{color:var(--yolk)}
.slide.light .bar.hot .t b{color:var(--ink);background:var(--yolk);padding:0 12px;border-radius:10px}
.slide .vs{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:44px}
.slide .vs .panel{margin:0;padding:30px 30px 18px}
.slide .vs h3{font-size:48px;font-weight:700;letter-spacing:-.02em;margin-bottom:14px}
.slide .vs p{font-size:38px;line-height:1.2;padding:16px 0;box-shadow:0 -1px 0 var(--rule);color:var(--fg3)}
.slide .vs p.on{color:var(--fg);font-weight:650}
.slide .vs.all p{color:var(--fg2)}

/* Open tabs */
.slide .tabs{position:absolute;left:80px;right:140px;top:290px}
.slide.ig .tabs{top:170px}
.slide .tab{position:absolute;display:flex;align-items:center;gap:26px;height:96px;padding:0 34px 0 38px;
  border-radius:28px;background:var(--glass);border:1px solid var(--edge);
  font-size:40px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;box-shadow:0 18px 40px rgba(0,0,0,.28)}
.slide.ig .tab{height:80px;font-size:36px;border-radius:24px}
.slide .tab i{font-style:normal;opacity:.45;font-weight:400}
.slide .tab.more{background:var(--on-bg);color:var(--on-fg);border-color:transparent}

/* Conversation: the person in glass, iXo in yellow */
.slide .chat{position:absolute;left:80px;right:140px;bottom:var(--bottom);display:flex;flex-direction:column;gap:34px}
.slide .msg{max-width:760px;padding:36px 42px;font-size:48px;line-height:1.26;letter-spacing:-.01em;border-radius:40px}
.slide .me{align-self:flex-end;background:var(--glass);border:1px solid var(--edge);border-bottom-right-radius:12px}
.slide .ixo{align-self:flex-start;background:var(--yolk);color:var(--ink);font-weight:550;border-bottom-left-radius:12px}
.slide .who{font-size:30px;font-weight:600;letter-spacing:0;margin-bottom:12px;opacity:.55}

/* Final: the photo stays full-bleed, iXo answers on a yellow sheet; content must end above y=1520 */
.slide .sheet{position:absolute;left:0;right:0;top:var(--sheet-top);bottom:0;padding:70px 80px 0;
  background:var(--yolk);color:var(--ink);border-radius:48px 48px 0 0;display:flex;flex-direction:column;align-items:flex-start}
.slide.ig .sheet{padding-top:56px}
.slide .sheet h1{font-size:100px;max-width:880px}
.slide.ig .sheet h1{font-size:84px}
.slide .sheet .sub{color:rgba(17,17,17,.78);max-width:800px}
.slide.ig .sheet .sub{margin-top:28px}
.slide .cta{display:flex;align-items:center;gap:22px;margin-top:48px;height:112px;padding:0 48px;border-radius:56px;
  background:var(--ink);color:var(--paper);font-size:42px;font-weight:600;letter-spacing:-.01em}
.slide.ig .cta{margin-top:36px;height:100px}
.slide .cta b{width:18px;height:18px;border-radius:50%;background:var(--yolk)}
.slide.safe::after{content:"";position:absolute;inset:150px 140px 400px 0;outline:3px dashed rgba(255,0,80,.7)}

/* Text-only iXo slides (the Mac mockup look), scoped under .ts so they live beside the photo slides.
   1080x1350 (Instagram 4:5) by default, .tt is 1080x1920 TikTok with room for its interface. */
.ts{--bg:#111;--panel:#1c1c1c;--raised:#242424;--line:#333;--ink:#f1f1ef;--muted:#aaa;--accent:#ffd705;--radius:32px;
  width:1080px;height:1350px;background:var(--bg);color:var(--ink);padding:72px 80px;display:flex;flex-direction:column;
  position:relative;overflow:hidden;font-family:"Inter Tight",Arial,sans-serif;text-align:left;-webkit-font-smoothing:antialiased}
.ts *{box-sizing:border-box;margin:0}
.ts.tt{height:1920px;padding:190px 150px 430px 80px}
.ts header,.ts footer{display:flex;justify-content:space-between;align-items:center;font-size:30px;color:var(--muted)}
.ts .logo{font-weight:700;font-size:44px;color:var(--ink);letter-spacing:-.04em}
.ts .logo i{font-style:normal;color:var(--accent)}
.ts main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:40px}
.ts .next{width:84px;height:84px;border-radius:50%;background:var(--accent);color:#111;display:grid;place-items:center;font-size:44px}
.ts .kicker{font-size:32px;color:var(--accent);font-weight:500;letter-spacing:.02em;text-transform:uppercase}
.ts .title{font-size:112px;line-height:1.02;font-weight:500;letter-spacing:-.035em;text-wrap:balance}
.ts .title em{font-style:normal;color:var(--accent)}
.ts .title.m{font-size:88px}
.ts .title.l{font-size:92px}
.ts .sub{font-size:44px;line-height:1.25;color:var(--muted);max-width:18em;text-wrap:pretty}
.ts .num{font-size:220px;font-weight:500;letter-spacing:-.05em;line-height:.8;color:var(--raised);position:absolute;right:64px;top:170px}
.ts.tt .num{right:150px;top:290px}
.ts .chips{display:flex;flex-direction:column;gap:20px;align-items:flex-start}
.ts .chip{font-size:46px;padding:28px 40px;border-radius:var(--radius);background:var(--panel);border:2px solid var(--line)}
.ts .chip.on{background:var(--accent);color:#111;border-color:var(--accent);font-weight:500}
.ts.glow::before{content:"";position:absolute;width:900px;height:900px;border-radius:50%;right:-380px;bottom:-420px;
  background:radial-gradient(closest-side,rgba(255,215,5,.28),transparent)}
.ts .bars{display:flex;flex-direction:column;gap:26px}
.ts .bar{display:grid;grid-template-columns:270px 1fr 90px;align-items:center;gap:24px;font-size:40px}
.ts .bar .track{height:36px;border-radius:18px;background:var(--panel);overflow:hidden}
.ts .bar .fill{height:100%;border-radius:18px;background:var(--muted)}
.ts .bar.hot .fill{background:var(--accent)}
.ts .bar.hot{color:var(--accent)}
.ts .bar b{font-weight:500;text-align:right}
.ts .chaos{position:relative;height:760px}
.ts .chaos span{position:absolute;font-size:40px;padding:22px 32px;border-radius:28px;background:var(--panel);border:2px solid var(--line);white-space:nowrap}
.ts .bubble{font-size:44px;line-height:1.25;padding:36px 44px;border-radius:var(--radius);max-width:780px}
.ts .bubble.me{align-self:flex-end;background:var(--raised)}
.ts .bubble.ixo{background:var(--panel);border:2px solid var(--accent)}
.ts .bubble small{display:block;font-size:28px;color:var(--accent);margin-bottom:10px;font-weight:600}
.ts.cta{background:var(--accent);color:#111}
.ts.cta header,.ts.cta footer,.ts.cta .logo,.ts.cta .sub{color:#111}
.ts.cta .logo i{color:#111}
.ts.cta .title em{color:#111;text-decoration:underline;text-decoration-thickness:6px;text-underline-offset:12px}
.ts .vs{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.ts .vs>div{background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);padding:44px 40px}
.ts .vs h4{font-size:52px;font-weight:500;margin-bottom:28px;letter-spacing:-.02em}
.ts .vs p{font-size:38px;line-height:1.2;padding:22px 0;border-top:2px solid var(--line)}
.ts .vs p.on{color:var(--accent);font-weight:500}
.ts.light{--bg:#f1f1ef;--panel:#fff;--raised:#e2e2dd;--line:#d6d6d0;--ink:#111;--muted:#666}
.ts.light .logo i{color:#111}
.ts.light .kicker{align-self:flex-start;background:var(--accent);color:#111;padding:8px 20px;border-radius:14px}
.ts.light .title em{color:#111;background:linear-gradient(transparent 60%,var(--accent) 60%)}
.ts.light .bar.hot{color:#111}
.ts.light .bubble small,.ts.light .vs p.on{color:#111}
.ts.light .vs p.on{background:var(--accent);margin:0 -18px;padding:22px 18px;border-radius:16px;border-top:0}
.ts.cta .kicker{background:none}
.ts.cta .title em{background:none}
.ts .btn{align-self:flex-start;white-space:nowrap;font-size:38px;font-weight:600;background:#111;color:#f1f1ef;padding:32px 52px;border-radius:999px}

</style>

<header class="bar">
  <div class="wrap">
    <div class="brand"><img src="ixo.svg" alt="iXo"><span data-t="brand"></span></div>
    <div class="seg" role="group" aria-label="Style" id="seg-style">
      <button type="button" data-v="photo" data-t="sPhoto"></button><button type="button" data-v="typo" data-t="sTypo"></button><button type="button" data-v="both" data-t="sBoth"></button>
    </div>
    <div class="seg" role="group" aria-label="Language" id="seg-lang">
      <button type="button" data-v="ru">RU</button><button type="button" data-v="en">EN</button>
    </div>
    <div class="seg" role="group" aria-label="Format" id="seg-fmt">
      <button type="button" data-v="tt"><span class="wide">TikTok </span>9:16</button><button type="button" data-v="ig"><span class="wide">Instagram </span>4:5</button>
    </div>
    <div class="seg" role="group" aria-label="Look" id="seg-theme">
      <button type="button" data-v="dark" data-t="dark"></button><button type="button" data-v="light" data-t="light"></button>
    </div>
  </div>
  <div class="wrap"><nav class="nav" id="nav" aria-label="Branches"></nav></div>
</header>

<main class="wrap" id="main">
  <section class="intro">
    <div>
      <h1 id="title"></h1>
      <p data-t="lead"></p>
    </div>
    <div>
      <ul class="rules">
        <li data-t="r0"></li><li data-t="r1"></li><li data-t="r2"></li><li class="y" data-t="r3"></li><li class="y" data-t="r4"></li>
      </ul>
      <p class="note" data-t="note"></p>
    </div>
  </section>
  <div id="branches"></div>
  <footer class="foot" data-t="foot"></footer>
</main>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="vname">
  <div class="vtop"><b id="vname"></b><span id="vpos"></span>
    <button type="button" class="ibtn x" id="vclose" aria-label="Close">✕</button></div>
  <div class="stage">
    <button type="button" class="ibtn" id="vprev" aria-label="Previous slide">←</button>
    <div class="vframe" id="vframe"></div>
    <button type="button" class="ibtn" id="vnext" aria-label="Next slide">→</button>
  </div>
  <div class="dots" id="vdots"></div>
</div>

<script>
/* Draws one iXo photo slide as HTML. Needs series.js and slides.css.
   IXO.slide(series, slide, {lang:'ru'|'en', img:'img-seedream', fmt:'tt'|'ig', theme:'dark'|'light', fx, lazy, logo})
   fx turns on the glass blur; lazy defers off-screen photos (never for PNG export, the shot would come out empty). */
(function () {
const CTA = {ru:'Ссылка в профиле', en:'Link in bio'};
const TAB_STEP = {tt:[36, 98], ig:[34, 80]};  // each tab sits right and below the previous one, like a pile
const MARK = 'ixo.svg';

function render(series, s, o) {
  const t = v => v == null ? '' : typeof v === 'string' ? v : v[o.lang] ?? v.ru;
  const fmt = o.fmt || 'tt';
  const cls = ['slide', fmt === 'ig' ? 'ig' : '', o.theme === 'light' ? 'light' : '', o.fx ? 'fx' : ''].filter(Boolean).join(' ');
  const z = s.zoom || 1, pos = s.pos || '50% 30%';
  // The standalone file embeds every photo once as a CSS class (IXO_CSS_PHOTOS), so slides use divs there
  const css = window.IXO_CSS_PHOTOS;
  const src = `${o.img}/${series.id}/${s.photo}.jpg`;
  const mark = css ? '<span class="mark mk" role="img" aria-label="iXo"></span>' : `<img class="mark" src="${o.logo || MARK}" alt="iXo">`;
  // flip mirrors the shot so the face sits opposite the text or tabs
  const move = origin => `transform:scale(${s.flip ? -z : z},${z});transform-origin:${origin}`;
  const shot = origin => css
    ? `<div class="photo ph-${series.id}-${s.photo}" style="background-position:${pos};${move(origin)}"></div>`
    : `<img class="photo" src="${src}" alt=""${o.lazy ? ' loading="lazy" decoding="async"' : ''} style="object-position:${pos};${move(origin)}">`;

  if (s.final) return `<div class="${cls}">${shot('50% 0')}<div class="scrim" style="opacity:.5"></div>${mark}
    <div class="sheet"><h1>${t(s.h)}</h1><div class="sub">${t(s.sub)}</div>
    <div class="cta"><b></b>${t(s.cta) || CTA[o.lang]}</div></div><div class="grain"></div></div>`;

  let panel = '';
  if (s.list) panel = `<div class="panel">${s.list.items.map((it, i) => {
      const k = s.list.keys === 'num' ? (s.list.from || 1) + i : s.list.keys === 'abc' ? 'ABCD'[i] : '';
      return `<div class="row${s.list.on === i ? ' on' : ''}">${k !== '' ? `<span class="k">${k}</span>` : ''}${t(it)}</div>`;
    }).join('')}</div>`;
  if (s.bars) {
    const max = Math.max(...s.bars.rows.map(r => r[1]));
    panel = `<div class="panel">${s.bars.rows.map(([name, n], i) =>
      `<div class="bar${s.bars.hot === i ? ' hot' : ''}"><div class="t"><span>${t(name)}</span><b>${n}</b></div>`
      + `<div class="track"><div class="fill" style="width:${n / max * 100}%"></div></div></div>`).join('')}</div>`;
  }
  if (s.vs) panel = `<div class="vs${s.vs.every(c => c[2] < 0) ? ' all' : ''}">${s.vs.map(([head, items, on]) =>
      `<div class="panel"><h3>${t(head)}</h3>${items.map((it, i) => `<p class="${i === on ? 'on' : ''}">${t(it)}</p>`).join('')}</div>`).join('')}</div>`;

  let body = '';
  if (s.tabs) {
    const [dx, dy] = TAB_STEP[fmt];
    const tabs = s.tabs.map(t).concat(s.more ? [t(s.more)] : []);
    body += `<div class="tabs">${tabs.map((label, i) => {
      const more = s.more && i === s.tabs.length;
      return `<div class="tab${more ? ' more' : ''}" style="left:${i * dx}px;top:${i * dy}px">${label}${more ? '' : '<i>×</i>'}</div>`;
    }).join('')}</div>`;
  }
  if (s.chat) body += `<div class="chat">${s.chat.map(([who, text]) =>
      `<div class="msg ${who}">${who === 'ixo' ? '<div class="who">iXo</div>' : ''}${t(text)}</div>`).join('')}</div>`;
  if (s.h) {
    const h = t(s.h), long = s.size === 'l' || h.replace(/<[^>]+>|&nbsp;/g, ' ').length > 44;
    body += `<div class="copy">${s.label ? `<div class="label">${t(s.label)}</div>` : ''}`
      + `<h1${panel ? ' class="m"' : long ? ' class="l"' : ''}>${h}</h1>${s.sub ? `<div class="sub">${t(s.sub)}</div>` : ''}${panel}</div>`;
  }
  return `<div class="${cls}${panel ? ' tall' : ''}">${shot(s.flip ? '50% 50%' : pos)}`
    + (s.dim ? `<div class="dim" style="--d:${s.dim}"></div>` : '')
    + `<div class="scrim"></div>${mark}${body}<div class="grain"></div></div>`;
}

window.IXO = Object.assign(window.IXO || {}, {slide: render});
})();

</script>
<script>
/* Text-only iXo slides, the look of the Mac mockup (carousels.html). Needs typo.css.
   IXO.typoSeries(photoSeries) gives the text-only version of a theme: the hand-made one from
   typo-series.js when it exists, otherwise one derived from the photo slides.
   IXO.typo(series, index, {lang, fmt:'tt'|'ig', theme:'dark'|'light'}) draws one slide. */
(function () {
const CHAOS_POS = [[20,10,-6],[470,90,4],[120,210,3],[560,300,-5],[40,400,5],[430,500,-3],[150,620,-4],[600,660,6]];
const BTN = {ru:'Ссылка в профиле', en:'Link in bio'};
const made = Object.fromEntries((window.IXO_TYPO_SERIES || []).map(s => [s.id, s]));

/* Photo slide -> text-only slide, for themes that were only made with photos */
function derive(ps) {
  const plain = v => v && Object.fromEntries(Object.entries(v).map(([k, t]) => [k, t.replace(/<br>/g, ' ')]));
  const slides = ps.slides.map((s, i) => {
    if (s.final) return {t:'cta', title:s.h, sub:s.sub, btn:BTN};
    if (s.chat) return {t:'chat', q:s.chat[0][1], a:s.chat[1][1]};
    if (s.tabs) return {t:'chaos', items:s.tabs};
    if (s.bars) return {t:'map', title:s.h, rows:s.bars.rows, hot:[s.bars.hot]};
    if (s.vs) return {t:'vs', title:s.h, a:{h:s.vs[0][0], items:s.vs[0][1], on:s.vs[0][2]}, b:{h:s.vs[1][0], items:s.vs[1][1], on:s.vs[1][2]}};
    if (s.list) return {t:'chips', kicker:s.label, title:s.h, on:s.list.on,
      items:s.list.items.map((it, k) => s.list.keys === 'num' ? Object.fromEntries(Object.entries(it).map(([l, v]) => [l, `${(s.list.from || 1) + k} · ${v}`]))
                                       : s.list.keys === 'abc' ? Object.fromEntries(Object.entries(it).map(([l, v]) => [l, `${'ABCD'[k]} · ${v}`])) : it)};
    return {t:i === 0 ? 'cover' : 'big', glow:i === 0 ? 1 : 0, kicker:s.label, title:plain(s.h), sub:s.sub, size:s.size};
  });
  return {id:ps.id, tag:ps.name, slides};
}

function typoSeries(ps) { return made[ps.id] || derive(ps); }

function draw(series, i, o) {
  const x = v => v == null ? '' : typeof v === 'string' ? v : v[o.lang] ?? v.ru;
  const s = series.slides[i], n = series.slides.length, last = i === n - 1;
  const kicker = s.kicker ? `<div class="kicker">${x(s.kicker)}</div>` : '';
  const num = s.num ? `<div class="num">${s.num}</div>` : '';
  const long = s.size === 'l' || x(s.title).replace(/<[^>]+>|&nbsp;/g, ' ').length > 40;
  let body = '';
  switch (s.t) {
    case 'cover': case 'big':
      body = `${num}${kicker}<div class="title${long ? ' l' : ''}">${x(s.title)}</div>${s.sub ? `<div class="sub">${x(s.sub)}</div>` : ''}`; break;
    case 'chips':
      body = `${num}${kicker}<div class="title m">${x(s.title)}</div><div class="chips">${s.items.map((it, k) =>
        `<div class="chip${s.on === k ? ' on' : ''}">${x(it)}</div>`).join('')}</div>`; break;
    case 'map': {
      const max = Math.max(...s.rows.map(r => r[1]), 1);
      body = `<div class="title m">${x(s.title)}</div><div class="bars">${s.rows.map(([name, v], k) =>
        `<div class="bar${s.hot.includes(k) ? ' hot' : ''}"><span>${x(name)}</span><div class="track"><div class="fill" style="width:${v / max * 100}%"></div></div><b>${v}</b></div>`).join('')}</div>`;
      break;
    }
    case 'chaos':
      body = `<div class="chaos">${s.items.slice(0, CHAOS_POS.length).map((it, k) => {
        const [l, t, r] = CHAOS_POS[k];
        return `<span style="left:${l}px;top:${t}px;transform:rotate(${r}deg)">${x(it)}</span>`;
      }).join('')}</div>`; break;
    case 'vs':  // hand-made comparisons highlight the last row; derived ones say which
      body = `<div class="title m">${x(s.title)}</div><div class="vs">${[s.a, s.b].map(c =>
        `<div><h4>${x(c.h)}</h4>${c.items.map((it, k) =>
          `<p class="${(c.on ?? c.items.length - 1) === k ? 'on' : ''}">${x(it)}</p>`).join('')}</div>`).join('')}</div>`; break;
    case 'chat':
      body = `<div class="bubble me">${x(s.q)}</div><div class="bubble ixo"><small>iXo</small>${x(s.a)}</div>`; break;
    case 'cta':
      body = `<div class="title">${x(s.title)}</div><div class="sub">${x(s.sub)}</div><div class="btn">${x(s.btn)}</div>`; break;
  }
  const cls = ['ts', o.fmt === 'tt' ? 'tt' : '', s.t === 'cta' ? 'cta' : '', s.glow ? 'glow' : '', o.theme === 'light' ? 'light' : ''].filter(Boolean).join(' ');
  const pad = v => String(v).padStart(2, '0');
  return `<div class="${cls}"><header><span class="logo">i<i>X</i>o</span><span>${pad(i + 1)} / ${pad(n)}</span></header>
    <main>${body}</main>
    <footer><span>${last ? 'ixo.chat' : x(series.tag)}</span>${last ? '' : '<span class="next">→</span>'}</footer></div>`;
}

window.IXO = Object.assign(window.IXO || {}, {typo:draw, typoSeries});
})();

</script>
<script>
(function () {
const UI = {
  brand:{ru:'Карусели', en:'Carousels'},
  sPhoto:{ru:'С героями', en:'With heroes'}, sTypo:{ru:'Без персонажей', en:'Text only'}, sBoth:{ru:'Оба', en:'Both'},
  dark:{ru:'Тёмные', en:'Dark'}, light:{ru:'Светлые', en:'Light'},
  title:{ru:n => `${n.themes} тем в ${n.branches} направлениях.<br><b>${n.carousels} ${plural(n.carousels, 'готовая карусель', 'готовые карусели', 'готовых каруселей')}.</b>`,
         en:n => `${n.themes} themes in ${n.branches} branches.<br><b>${n.carousels} carousels ready to post.</b>`},
  lead:{ru:'Каждая тема сделана в двух стилях: с героем на живых фото и без персонажей, на чистой типографике. У каждой своя задача: охват, комментарии, сохранения или переходы на сайт. Переключите стиль, язык, формат и оформление сверху. Нажмите на слайд, чтобы листать его на весь экран.',
        en:'Every theme comes in two styles: with a hero in real-life photos, and text only in clean typography. Each has its own job: reach, comments, saves or site visits. Switch style, language, format and look at the top. Tap a slide to page through it full screen.'},
  r0:{ru:'Два стиля одной темы: можно проверить, что работает лучше — люди или слова.', en:'Two styles of one theme, to test what works better: people or words.'},
  r1:{ru:'С героем: один человек на карусель, каждый слайд — новый кадр его истории.', en:'With a hero: one person per carousel, every slide a new shot of their story.'},
  r2:{ru:'Текст держится вне зон интерфейса TikTok.', en:'Text stays clear of TikTok’s interface.'},
  r3:{ru:'Жёлтым говорит iXo: ответы в переписке, карта, финал.', en:'iXo speaks in yellow: chat replies, the map, the final slide.'},
  r4:{ru:'Последний слайд — жёлтый, с призывом и ссылкой в профиле.', en:'The last slide is yellow, with the call to action and the link in bio.'},
  note:{ru:'Фото созданы ИИ, люди на них вымышленные.', en:'Photos are AI-generated; the people in them are fictional.'},
  foot:{ru:'iXo — личный AI-коуч, ixo.chat. Макеты каруселей для TikTok и Instagram.', en:'iXo is a personal AI coach, ixo.chat. Carousel layouts for TikTok and Instagram.'},
  themes:{ru:n => `${n} ${plural(n, 'тема', 'темы', 'тем')}`, en:n => `${n} ${n === 1 ? 'theme' : 'themes'}`},
  slides:{ru:n => `${n} ${plural(n, 'слайд', 'слайда', 'слайдов')}`, en:n => `${n} slides`},
  goal:{ru:'Цель', en:'Goal'},
};
const GOALS = {
  reach:{ru:'Охват', en:'Reach'}, comments:{ru:'Комментарии', en:'Comments'}, saves:{ru:'Сохранения', en:'Saves'},
  shares:{ru:'Репосты', en:'Shares'}, clicks:{ru:'Переходы на сайт', en:'Site visits'}, follows:{ru:'Подписки', en:'Follows'},
};
function plural(n, one, few, many) {
  const a = n % 10, b = n % 100;
  return a === 1 && b !== 11 ? one : a >= 2 && a <= 4 && (b < 12 || b > 14) ? few : many;
}
const store = {
  get(k, d) { try { return localStorage.getItem('ixo-' + k) || d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ixo-' + k, v); } catch (e) {} },
};
const state = {lang:store.get('lang', 'ru'), fmt:store.get('fmt', 'tt'), theme:store.get('theme', 'dark'), style:store.get('style', 'both')};
const $ = s => document.querySelector(s);
const byId = Object.fromEntries(IXO_SERIES.map(s => [s.id, s]));
const typoOf = Object.fromEntries(IXO_SERIES.map(s => [s.id, IXO.typoSeries(s)]));
// The order themes appear in, so the viewer can run on from one theme to the next
const ORDER = IXO_BRANCHES.flatMap(b => b.themes);

function draw(id, style, i, extra) {
  const o = {lang:state.lang, fmt:state.fmt, theme:state.theme, img:'img', logo:'ixo.svg', lazy:true, ...extra};
  return style === 'photo' ? IXO.slide(byId[id], byId[id].slides[i], o) : IXO.typo(typoOf[id], i, o);
}
const count = (id, style) => (style === 'photo' ? byId[id] : typoOf[id]).slides.length;

function seg(id, key) {
  $(id).querySelectorAll('button').forEach(b => {
    b.setAttribute('aria-pressed', String(b.dataset.v === state[key]));
    b.onclick = () => { state[key] = b.dataset.v; store.set(key, b.dataset.v); render(); };
  });
}
function strip(id, style) {
  const n = count(id, style), name = byId[id].name[state.lang];
  return `<div><p class="cap">${UI[style === 'photo' ? 'sPhoto' : 'sTypo'][state.lang]}<span>${UI.slides[state.lang](n)}</span></p>
    <div class="strip" role="list">${Array.from({length:n}, (_, i) =>
      `<button type="button" class="frame" role="listitem" data-id="${id}" data-style="${style}" data-i="${i}" aria-label="${name}, ${i + 1}/${n}">`
      + draw(id, style, i) + `<span class="num">${i + 1}/${n}</span></button>`).join('')}</div></div>`;
}
function branches() {
  const L = state.lang, styles = state.style === 'both' ? ['photo', 'typo'] : [state.style];
  $('#nav').innerHTML = IXO_BRANCHES.map(b => `<a href="#${b.id}">${b.name[L]}<span class="n">${b.themes.length}</span></a>`).join('');
  $('#branches').innerHTML = IXO_BRANCHES.map((b, bi) => `
    <section class="branch" id="${b.id}">
      <div class="bhead">
        <div><div class="k">${String(bi + 1).padStart(2, '0')} / ${String(IXO_BRANCHES.length).padStart(2, '0')} · ${UI.themes[L](b.themes.length)}</div><h2>${b.name[L]}</h2></div>
        <p>${b.desc[L]}</p>
      </div>
      ${b.themes.map(id => { const s = byId[id]; return `
      <article class="theme" id="${id}">
        <div class="meta">
          <span class="pill">${UI.goal[L]}: ${GOALS[s.goal][L]}</span>
          <h3>${s.name[L]}</h3>
          <p class="why">${s.why[L]}</p>
          <p class="ixo">${s.ixo[L]}</p>
        </div>
        <div class="strips">${styles.map(st => strip(id, st)).join('')}</div>
      </article>`; }).join('')}
    </section>`).join('');
  document.querySelectorAll('.frame').forEach(f => f.onclick = () => open(f.dataset.id, f.dataset.style, +f.dataset.i));
  fit();
}
function fit() {
  const f = document.querySelector('.frame');
  if (f) document.body.style.setProperty('--k', f.clientWidth / 1080);
  const v = $('#vframe');
  if (!$('#viewer').hidden) v.style.setProperty('--k', v.clientWidth / 1080);
}
function render() {
  document.documentElement.lang = state.lang;
  document.body.classList.toggle('ig', state.fmt === 'ig');
  document.body.classList.toggle('both', state.style === 'both');
  seg('#seg-style', 'style'); seg('#seg-lang', 'lang'); seg('#seg-fmt', 'fmt'); seg('#seg-theme', 'theme');
  document.querySelectorAll('[data-t]').forEach(el => el.innerHTML = UI[el.dataset.t][state.lang]);
  const slides = IXO_SERIES.reduce((n, s) => n + s.slides.length + typoOf[s.id].slides.length, 0);
  $('#title').innerHTML = UI.title[state.lang]({themes:IXO_SERIES.length, branches:IXO_BRANCHES.length, carousels:IXO_SERIES.length * 2, slides});
  branches();
  if (!$('#viewer').hidden) show();
}

/* Highlight the branch in view */
if ('IntersectionObserver' in window) {
  const seen = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) document.querySelectorAll('.nav a').forEach(a => a.classList.toggle('on', a.hash === '#' + e.target.id));
  }), {rootMargin:'-40% 0px -55% 0px'});
  new MutationObserver(() => document.querySelectorAll('.branch').forEach(b => seen.observe(b))).observe($('#branches'), {childList:true});
}

/* Viewer: pages through one style, running on into the next theme */
let cur = {id:ORDER[0], style:'photo', i:0}, last = null;
function open(id, style, i) { cur = {id, style, i}; last = document.activeElement; $('#viewer').hidden = false; document.body.style.overflow = 'hidden'; show(); $('#vclose').focus(); }
function close() { $('#viewer').hidden = true; document.body.style.overflow = ''; if (last) last.focus(); }
function step(d) {
  const n = count(cur.id, cur.style), k = ORDER.indexOf(cur.id);
  if (cur.i + d >= 0 && cur.i + d < n) cur.i += d;
  else if (d > 0 && k < ORDER.length - 1) cur = {...cur, id:ORDER[k + 1], i:0};
  else if (d < 0 && k > 0) cur = {...cur, id:ORDER[k - 1], i:count(ORDER[k - 1], cur.style) - 1};
  show();
}
function show() {
  const n = count(cur.id, cur.style);
  $('#vname').textContent = `${byId[cur.id].name[state.lang]} · ${UI[cur.style === 'photo' ? 'sPhoto' : 'sTypo'][state.lang]}`;
  $('#vpos').textContent = `${cur.i + 1} / ${n}`;
  $('#vframe').innerHTML = draw(cur.id, cur.style, cur.i, {lazy:false, fx:true});
  $('#vdots').innerHTML = Array.from({length:n}, (_, i) => `<i class="${i === cur.i ? 'on' : ''}"></i>`).join('');
  requestAnimationFrame(fit);
}
$('#vclose').onclick = close;
$('#vprev').onclick = () => step(-1);
$('#vnext').onclick = () => step(1);
$('#viewer').addEventListener('click', e => { if (e.target.id === 'viewer') close(); });
document.addEventListener('keydown', e => {
  if ($('#viewer').hidden) return;
  if (e.key === 'Escape') close();
  if (e.key === 'ArrowRight') step(1);
  if (e.key === 'ArrowLeft') step(-1);
});
let x0 = null;
$('#vframe').addEventListener('touchstart', e => x0 = e.touches[0].clientX, {passive:true});
$('#vframe').addEventListener('touchend', e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0; x0 = null;
  if (Math.abs(dx) > 40) step(dx < 0 ? 1 : -1); else step(1);
});
$('#vframe').addEventListener('click', e => { if (!('ontouchstart' in window)) step(e.offsetX > e.currentTarget.clientWidth / 2 ? 1 : -1); });
addEventListener('resize', fit);
if ('ResizeObserver' in window) new ResizeObserver(fit).observe(document.body);

render();
if (location.hash.length > 1) { const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
})();
</script>
